[project]
name = "codelens-backend"
version = "0.2.0"
description = "Offline semantic code search: tree-sitter chunking, local Ollama embeddings, SQLite vector store"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.4",
    "ollama>=0.5.0",
    # Pinned below 0.26: 0.26.0 against the current grammar wheels corrupts
    # memory and segfaults after a few hundred parses.
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python",
    "tree-sitter-typescript",
    "tree-sitter-javascript",
    "tree-sitter-go",
    "tree-sitter-rust",
    "tree-sitter-java",
    "watchdog>=4.0.0",
    "rich>=13.7.1",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
# Every test monkeypatches Ollama; none require a running model or network.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
