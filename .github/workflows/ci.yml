name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    name: Python tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      # No test requires a running Ollama or any network access: embedding is
      # monkeypatched throughout.
      - name: Run test suite
        run: python -m pytest -q

  extension:
    name: Extension build and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -p ./ --noEmit

      - name: Run Jest tests
        run: npx jest --ci

      - name: Verify the backend is packaged into the .vsix
        run: |
          npx tsc -p ./
          npx vsce package --allow-missing-repository --skip-license --out codelens.vsix
          unzip -o -q codelens.vsix -d unpacked
          test -f unpacked/extension/backend/main.py
          test -f unpacked/extension/requirements.txt
          test -f unpacked/extension/extension/media/panel.html
          echo "backend, requirements and webview all present in the .vsix"
